# H2 In-Memory Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:popcorntime;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Cache (disabled for unit tests)
spring.cache.type=none

# RazorPay dummy credentials for test
api.razorpay.key.id=test_razorpay_key
api.razorpay.key.secret=test_razorpay_secret

# Redis test dummy config
